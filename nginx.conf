server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /landing.html {
        return 302 /$is_args$args;
    }

    location = / {
        try_files /landing.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
